<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Space Game Mission Cards</title>
    <style>
        body {
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 40px;
        }

        .row-title {
            color: #8892b0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: -10px;
            width: 100%;
            max-width: 800px;
            border-bottom: 1px solid #232d3f;
            padding-bottom: 5px;
        }

        .card-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 800px;
        }

        /* Exact Standard Magic: The Gathering Card Dimensions (2.5" x 3.5") */
        .card {
            width: 2.5in;
            height: 3.5in;
            background: #ffffff;
            border: 4px solid #0a0a0a;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Top Header */
        .header {
            background: #0f172a;
            color: #f8fafc;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 10px 0;
            text-transform: uppercase;
            border-bottom: 2px solid #1e293b;
        }

        .station-header {
            background: #1e1b4b;
            border-bottom: 2px solid #312e81;
        }

        /* Middle Canvas Area */
        .middle-canvas {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            position: relative;
            padding: 0;
            overflow: hidden;
        }

        /* Background local images */
        .local-image-placeholder {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.50;
            z-index: 1;
        }

        /* Overlay container for the 4 resource slots */
        .resource-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            padding: 12px;
            box-sizing: border-box;
        }

        /* Highly Translucent Grey Resource Box */
        .resource-box {
            background: rgba(40, 40, 40, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Centered completely */
            padding: 4px;
            box-sizing: border-box;
            backdrop-filter: blur(2px);
        }

        /* Mission Objective Label (R1 - R4) */
        .resource-label {
            color: #00f2fe;
            font-family: 'Courier New', Courier, monospace;
            font-size: 48px;
            /* Slightly bumped size for prominent centering */
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.6);
            user-select: none;
        }

        /* Premium Sci-Fi Bottom Scoring Area */
        .footer {
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0c1524 0%, #060b12 100%);
            border-top: 2px solid #1a2942;
            padding-bottom: 4px;
            position: relative;
        }

        .footer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 8px 8px;
            pointer-events: none;
        }

        /* Filled Circle for Victory Points */
        .points-circle {
            width: 44px;
            height: 44px;
            border: 3px solid #00f2fe;
            border-radius: 50%;
            background: #020617;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3), inset 0 2px 6px rgba(0, 0, 0, 0.8);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00f2fe;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: -0.5px;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>

<body>

    <!-- REUSABLE GRID TEMPLATE -->
    <div style="display:none;">
        <div id="resource-template">
            <div class="resource-overlay">
                <div class="resource-box">
                    <span class="resource-label">R1</span>
                </div>
                <div class="resource-box">
                    <span class="resource-label">R2</span>
                </div>
                <div class="resource-box">
                    <span class="resource-label">R3</span>
                </div>
                <div class="resource-box">
                    <span class="resource-label">R4</span>
                </div>
            </div>
        </div>
    </div>

    <div class="row-title">Planet Decks</div>
    <div class="card-row">

        <!-- CARD 1: RITER -->
        <div class="card">
            <div class="header">Riter</div>
            <div class="middle-canvas">
                <img src="riter.png" alt="Riter Image" class="local-image-placeholder">
                <script>document.write(document.getElementById('resource-template').innerHTML);</script>
            </div>
            <div class="footer">
                <div class="points-circle">10</div>
            </div>
        </div>

        <!-- CARD 2: KAELIS -->
        <div class="card">
            <div class="header">Kaelis</div>
            <div class="middle-canvas">
                <img src="kaelis.png" alt="Kaelis Image" class="local-image-placeholder">
                <script>document.write(document.getElementById('resource-template').innerHTML);</script>
            </div>
            <div class="footer">
                <div class="points-circle">10</div>
            </div>
        </div>

        <!-- CARD 3: OILIA -->
        <div class="card">
            <div class="header">Oilia</div>
            <div class="middle-canvas">
                <img src="oilia.png" alt="Oilia Image" class="local-image-placeholder">
                <script>document.write(document.getElementById('resource-template').innerHTML);</script>
            </div>
            <div class="footer">
                <div class="points-circle">10</div>
            </div>
        </div>
    </div>

    <div class="row-title">Space Station Decks</div>
    <div class="card-row">

        <!-- CARD 4: NEXUS SEVEN -->
        <div class="card">
            <div class="header station-header">Nexus Seven</div>
            <div class="middle-canvas">
                <img src="nexus_seven.png" alt="Nexus Seven Image" class="local-image-placeholder">
                <script>document.write(document.getElementById('resource-template').innerHTML);</script>
            </div>
            <div class="footer">
                <div class="points-circle">10</div>
            </div>
        </div>

        <!-- CARD 5: APEX ONE -->
        <div class="card">
            <div class="header station-header">Apex One</div>
            <div class="middle-canvas">
                <img src="apex_one.png" alt="Apex One Image" class="local-image-placeholder">
                <script>document.write(document.getElementById('resource-template').innerHTML);</script>
            </div>
            <div class="footer">
                <div class="points-circle">10</div>
            </div>
        </div>
    </div>

</body>

</html>
